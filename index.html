<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07070f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QuizPortal" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-TileColor" content="#6c63ff" />
  <title>QuizPortal — Online Quiz Platform</title>
  <meta name="description" content="Online Quiz Portal — attempt quizzes, track results, and challenge yourself with our interactive quiz platform." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- Auth Page -->
<main class="auth-page" id="auth-page">

  <!-- Animated Orbs -->
  <div class="auth-orb auth-orb-1"></div>
  <div class="auth-orb auth-orb-2"></div>
  <div class="auth-orb auth-orb-3"></div>

  <div class="auth-container">

    <!-- Theme Toggle -->
    <div class="auth-header-row">
      <button class="theme-toggle" id="auth-theme-toggle" title="Toggle Dark/Light Mode">🌙</button>
    </div>

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">🎯</div>
      <h1>QuizPortal</h1>
      <p>Learn · Test · Excel</p>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">

      <!-- Card Title -->
      <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--text-primary);">🔑 Portal Login</h2>
        <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Sign in with your registered account</p>
      </div>

      <!-- ── LOGIN PANEL ── -->
      <div id="panel-login" class="auth-form-panel">
        <form class="auth-form" id="login-form" novalidate>

          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <div class="input-icon-wrap">
              <span class="input-icon">✉️</span>
              <input
                type="email"
                id="login-email"
                class="form-input"
                placeholder="you@example.com"
                autocomplete="off"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="input-icon-wrap">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                id="login-password"
                class="form-input"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button type="button" class="eye-toggle" id="login-eye" title="Show/Hide Password" aria-label="Toggle password visibility">👁️</button>
            </div>
          </div>

          <div class="form-error hidden" id="login-error" role="alert"></div>

          <button type="submit" class="btn btn-primary auth-submit" id="login-btn">
            🚀 Login to Portal
          </button>
        </form>

        <div style="margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); text-align: center; font-size: 0.78rem; color: var(--text-muted);">
          🎓 Student accounts are registered &amp; managed by the Administrator.
        </div>

      </div>

    </div><!-- /.auth-card -->
  </div><!-- /.auth-container -->
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
